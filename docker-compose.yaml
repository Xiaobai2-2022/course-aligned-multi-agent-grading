name: course-aligned-multi-agent-grading

x-vllm-common: &vllm-common
    restart: unless-stopped
    ipc: host
    gpus: all

    environment:
        HF_TOKEN: ${HF_TOKEN}
        HF_HOME: /root/.cache/huggingface
        TOKENIZERS_PARALLELISM: "false"

    volumes:
        - ./hf-cache:/root/.cache/huggingface

    networks:
        - test-design

services:

    # Agent 1: test-case-design
    qwen-3_8:
        <<: *vllm-common
        image: ${VLLM_IMAGE}
        container_name: test-design-qwen-3_8

        entrypoint: ["vllm", "serve"]

        command:
            - Inferact/Qwen3.8-27B-NVFP4
            - --served-model-name
            - test-design
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --dtype
            - bfloat16
            - --kv-cache-dtype
            - bfloat16
            - --tensor-parallel-size
            - "${TP_SIZE:-1}"
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "262144"
            - --max-num-seqs
            - "1"
            - --reasoning-parser
            - qwen3
            - --limit-mm-per-prompt
            - '{"image": 16}'

        ports:
            - "127.0.0.1:8000:8000"

    postgres:
        image: postgres:18
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: app_db
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        networks:
            - test-design
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d app_db" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        stop_grace_period: 60s

networks:
    test-design:
        driver: bridge

volumes:
  postgres_data:
